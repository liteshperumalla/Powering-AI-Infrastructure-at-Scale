name: Performance Testing

# The load and stress jobs hit a deployed API. They only run when the repository
# variable for the selected environment is set (Settings → Secrets and variables →
# Actions → Variables):
#   PERF_STAGING_URL     e.g. https://api.staging.example.com
#   PERF_PRODUCTION_URL  e.g. https://api.example.com
# Optional secrets PERF_USER_EMAIL / PERF_USER_PASSWORD let the load test call
# authenticated read endpoints; without them it only exercises /health.
# The database benchmark is self-contained and always runs.

on:
  schedule:
    - cron: '0 4 * * 1'  # Weekly on Monday at 4 AM UTC
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      duration:
        description: 'Test duration in minutes'
        required: true
        default: '10'
        type: string

permissions:
  contents: read

env:
  TARGET_URL: ${{ github.event.inputs.environment == 'production' && vars.PERF_PRODUCTION_URL || vars.PERF_STAGING_URL }}

jobs:
  load-test:
    name: Load Testing
    runs-on: ubuntu-latest
    if: (github.event.inputs.environment == 'production' && vars.PERF_PRODUCTION_URL != '') || (github.event.inputs.environment != 'production' && vars.PERF_STAGING_URL != '')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install locust

    - name: Create Locust test file
      run: |
        cat > locustfile.py << 'EOF'
        import os
        from locust import HttpUser, task, between

        EMAIL = os.environ.get("PERF_USER_EMAIL")
        PASSWORD = os.environ.get("PERF_USER_PASSWORD")

        class InfraMindUser(HttpUser):
            wait_time = between(1, 3)

            def on_start(self):
                self.headers = None
                if EMAIL and PASSWORD:
                    response = self.client.post("/api/v1/auth/login", json={
                        "email": EMAIL,
                        "password": PASSWORD,
                    })
                    if response.status_code == 200:
                        token = response.json().get("access_token")
                        self.headers = {"Authorization": f"Bearer {token}"}

            @task(3)
            def health_check(self):
                self.client.get("/health")

            # Read-only: a scheduled job must not create data in a real environment
            @task(2)
            def list_assessments(self):
                if self.headers:
                    self.client.get("/api/v2/assessments/", headers=self.headers)
        EOF

    - name: Run load test
      env:
        DURATION: ${{ github.event.inputs.duration || '10' }}
        PERF_USER_EMAIL: ${{ secrets.PERF_USER_EMAIL }}
        PERF_USER_PASSWORD: ${{ secrets.PERF_USER_PASSWORD }}
      run: |
        locust -f locustfile.py \
               --host="$TARGET_URL" \
               --users=50 \
               --spawn-rate=5 \
               --run-time="${DURATION}m" \
               --html=load-test-report.html \
               --csv=load-test-results \
               --headless

    - name: Upload load test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: load-test-results
        path: |
          load-test-report.html
          load-test-results_*.csv

  stress-test:
    name: Stress Testing
    runs-on: ubuntu-latest
    if: (github.event.inputs.environment == 'production' && vars.PERF_PRODUCTION_URL != '') || (github.event.inputs.environment != 'production' && vars.PERF_STAGING_URL != '')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install k6
      run: |
        sudo gpg -k
        sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
        echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install k6

    - name: Create k6 stress test script
      run: |
        cat > stress-test.js << 'EOF'
        import http from 'k6/http';
        import { check, sleep } from 'k6';
        import { Rate } from 'k6/metrics';

        export let errorRate = new Rate('errors');

        export let options = {
          stages: [
            { duration: '2m', target: 10 },   // Ramp up
            { duration: '5m', target: 50 },   // Stay at 50 users
            { duration: '2m', target: 100 },  // Ramp up to 100 users
            { duration: '5m', target: 100 },  // Stay at 100 users
            { duration: '2m', target: 200 },  // Ramp up to 200 users
            { duration: '5m', target: 200 },  // Stay at 200 users
            { duration: '2m', target: 0 },    // Ramp down
          ],
          thresholds: {
            http_req_duration: ['p(95)<500'],
            http_req_failed: ['rate<0.1'],
            errors: ['rate<0.1'],
          },
        };

        const BASE_URL = __ENV.TARGET_URL;

        // /docs is not exposed outside debug mode, so only the health endpoint is stressed
        export default function() {
          let response = http.get(`${BASE_URL}/health`);
          let result = check(response, {
            'health check status is 200': (r) => r.status === 200,
            'health check response time < 500ms': (r) => r.timings.duration < 500,
          });
          errorRate.add(!result);

          sleep(1);
        }
        EOF

    - name: Run stress test
      run: |
        k6 run --summary-export=stress-test-results.json stress-test.js

    - name: Upload stress test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: stress-test-results
        path: stress-test-results.json

  database-performance:
    name: Database Performance Test
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: test
          MONGO_INITDB_ROOT_PASSWORD: test
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pymongo pytest pytest-benchmark

    - name: Create database performance test
      run: |
        # pytest-benchmark can't time coroutines, so this uses the sync pymongo driver
        cat > test_db_performance.py << 'EOF'
        import random
        import string
        from datetime import datetime, timezone

        import pytest
        from pymongo import MongoClient


        @pytest.fixture
        def db():
            client = MongoClient("mongodb://test:test@localhost:27017", serverSelectionTimeoutMS=10000)
            database = client.test_performance
            yield database
            client.drop_database("test_performance")
            client.close()


        def _assessment(i):
            return {
                "user_id": f"user_{i}",
                "status": random.choice(["pending", "completed"]),
                "business_requirements": {
                    "company_size": random.choice(["small", "medium", "large"]),
                    "industry": random.choice(["tech", "finance", "healthcare"]),
                    "budget_range": random.choice(["10k-50k", "50k-100k", "100k+"]),
                },
                "created_at": datetime.now(timezone.utc),
                "data": "".join(random.choices(string.ascii_letters, k=1000)),
            }


        @pytest.mark.benchmark(group="insert")
        def test_insert_performance(benchmark, db):
            collection = db.assessments

            def insert_documents():
                collection.insert_many([_assessment(i) for i in range(100)])

            benchmark.pedantic(insert_documents, rounds=5)
            assert collection.count_documents({}) == 500


        @pytest.mark.benchmark(group="query")
        def test_query_performance(benchmark, db):
            collection = db.assessments
            collection.insert_many([
                {
                    "user_id": f"user_{i % 100}",
                    "status": random.choice(["pending", "completed"]),
                    "created_at": datetime.now(timezone.utc),
                    "score": random.randint(1, 100),
                }
                for i in range(1000)
            ])
            collection.create_index([("user_id", 1), ("status", 1)])

            def query_documents():
                return len(list(collection.find({"user_id": "user_50", "status": "completed"})))

            result = benchmark.pedantic(query_documents, rounds=10)
            assert 0 <= result <= 10
        EOF

    - name: Run database performance tests
      run: |
        pytest test_db_performance.py --benchmark-json=db-benchmark.json -v

    - name: Upload database performance results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: database-performance-results
        path: db-benchmark.json
